<body class="bg-surface font-body-md text-on-surface overflow-x-hidden min-h-screen flex items-center justify-center py-xxl px-base">

<!-- Main Content Container -->

<div class="glass-card rounded-[24px] p-lg md:p-xl flex flex-col gap-lg">
<!-- Branding Header -->
<div class="text-center flex flex-col items-center gap-sm"><h1 class="font-display text-headline-lg text-primary font-bold tracking-tight">RHK</h1><p class="text-on-surface-variant font-body-md">Create your shop account</p></div>

<div class="flex justify-center mt-sm">
<div class="flex items-center bg-[#f0f4ff] rounded-full p-1 w-fit shadow-sm mx-auto"><button type="button" class="bg-transparent text-primary font-button text-label-sm px-xl py-md rounded-full transition-all duration-200">CUSTOMER</button><button type="button" class="bg-primary text-on-primary font-button text-label-sm px-xl py-md rounded-full transition-all duration-200 shadow-sm">SHOP OWNER</button></div>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Name Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant px-xs">First Name</label>
<input class="bg-surface-container-lowest border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="e.g. John" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant px-xs">Last Name</label>
<input class="bg-surface-container-lowest border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="e.g. Doe" type="text">
</div>
</div>
<!-- Store Name -->
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant px-xs">Store Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">store</span>
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-lg p-md pl-[48px] focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="Your brand name" type="text">
</div>
</div>
<!-- Location -->
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant px-xs">Location of the Shop</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-lg p-md pl-[48px] focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="Search address or city" type="text">
</div>
</div>
<!-- Business Permit Upload -->
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant px-xs">Upload Business Permit for Verification</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-xl bg-surface-container-low/50 flex flex-col items-center justify-center gap-sm cursor-pointer hover:bg-surface-container-high transition-all group">
<div class="w-12 h-12 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform bg-primary">

</div>

</div>
</div>

<!-- Divider -->

<!-- Secondary Action -->

</form>

<div class="text-center mt-sm"><p class="text-on-surface-variant font-body-md">Already have an account? <a href="#" class="text-primary font-bold hover:underline">Sign in</a></p></div></div>

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
        
        // Simple drag & drop visual feedback simulation
        const dropzone = document.querySelector('.border-dashed');
        if(dropzone) {
            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.add('border-primary', 'bg-primary-container/10');
                });
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.remove('border-primary', 'bg-primary-container/10');
                });
            });
        }
    </script>
