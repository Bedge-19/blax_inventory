<div class="flex flex-col h-full bg-surface">
  <!-- Header Section -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-on-surface">Live Delivery Tracking</h1>
      <p class="text-on-surface-variant">Real-time oversight of all tenant deliveries across Polomolok.</p>
    </div>
    <div class="flex gap-3">
      <div class="flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-lg border border-outline-variant">
        <span class="w-3 h-3 bg-primary rounded-full animate-pulse"></span>
        <span class="text-sm font-medium">124 Active Deliveries</span>
      </div>
      <button class="bg-primary text-on-primary px-4 py-2 rounded-lg font-medium shadow-sm hover:opacity-90 transition-opacity">
        Export Tracking Log
      </button>
    </div>
  </div>

  <!-- Main Map Container -->
  <div class="relative flex-1 rounded-2xl overflow-hidden border border-outline-variant bg-surface-container shadow-inner" style="min-height: 600px;">
    <!-- Abstract Map Background (Stylized for UI) -->
    <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, rgba(0,0,0,0.1) 1px, transparent 0); background-size: 40px 40px;"></div>
    
    <!-- Moving Delivery Circles -->
    <div id="tracking-container" class="absolute inset-0"></div>

    <!-- Map Legend/Overlay -->
    <div class="absolute bottom-6 left-6 p-4 bg-surface/90 backdrop-blur-md rounded-xl border border-outline-variant shadow-lg max-w-xs">
      <h3 class="text-sm font-bold mb-3">Live Fleet Status</h3>
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full" style="background-color: #3b82f6;"></span>
            InkMaster Pro
          </span>
          <span class="font-mono text-on-surface-variant">42 units</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full" style="background-color: #10b981;"></span>
            RHK General
          </span>
          <span class="font-mono text-on-surface-variant">38 units</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full" style="background-color: #f59e0b;"></span>
            Creative Prints
          </span>
          <span class="font-mono text-on-surface-variant">25 units</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full" style="background-color: #ef4444;"></span>
            Luxe Essentials
          </span>
          <span class="font-mono text-on-surface-variant">19 units</span>
        </div>
      </div>
      <div class="mt-4 pt-3 border-t border-outline-variant text-[10px] text-on-surface-variant italic">
        * Circles represent active transit units. Updated every 5 seconds.
      </div>
    </div>

    <!-- Map Search/Filters -->
    <div class="absolute top-6 left-6 flex gap-2">
      <div class="relative">
        <input type="text" placeholder="Search delivery ID..." class="w-64 pl-10 pr-4 py-2 rounded-lg bg-surface/90 backdrop-blur-md border border-outline-variant shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 text-sm">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
      </div>
      <select class="px-4 py-2 rounded-lg bg-surface/90 backdrop-blur-md border border-outline-variant shadow-sm text-sm focus:outline-none">
        <option>All Shops</option>
        <option>InkMaster Pro</option>
        <option>RHK General</option>
      </select>
    </div>
  </div>

  <style>
    @keyframes float-around {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(15px, -15px); }
      50% { transform: translate(30px, 0px); }
      75% { transform: translate(15px, 15px); }
    }

    .delivery-marker {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transition: top 5s linear, left 5s linear;
    }

    .delivery-marker::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid currentColor;
      opacity: 0.3;
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>

  <script>
    (function() {
      const container = document.getElementById('tracking-container');
      const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
      const markerCount = 40;
      const markers = [];

      function createMarker() {
        const marker = document.createElement('div');
        marker.className = 'delivery-marker';
        const color = colors[Math.floor(Math.random() * colors.length)];
        marker.style.backgroundColor = color;
        marker.style.color = color;
        
        // Random starting position
        const startX = Math.random() * 95;
        const startY = Math.random() * 95;
        marker.style.left = startX + '%';
        marker.style.top = startY + '%';
        
        container.appendChild(marker);
        
        return {
          el: marker,
          x: startX,
          y: startY,
          dx: (Math.random() - 0.5) * 2,
          dy: (Math.random() - 0.5) * 2
        };
      }

      for (let i = 0; i < markerCount; i++) {
        markers.push(createMarker());
      }

      function updateMarkers() {
        markers.forEach(m => {
          // Update internal logic position
          m.x += m.dx;
          m.y += m.dy;

          // Bounce off boundaries
          if (m.x < 5 || m.x > 95) m.dx *= -1;
          if (m.y < 5 || m.y > 95) m.dy *= -1;

          // Apply to DOM
          m.el.style.left = m.x + '%';
          m.el.style.top = m.y + '%';
        });
        requestAnimationFrame(updateMarkers);
      }

      // Start animation
      setTimeout(() => {
        // We use requestAnimationFrame for smooth drift, 
        // but the CSS transition property on .delivery-marker handles the smoothness
        updateMarkers();
      }, 100);
    })();
  </script>
</div>
